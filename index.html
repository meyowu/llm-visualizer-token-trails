<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Token Trails</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230B0D11'/%3E%3Cpath d='M3 7h18M3 12h18M3 17h18' stroke='%23434A58' stroke-width='1.4'/%3E%3Cpath d='M9 17C3 15 3 9 9 7' fill='none' stroke='%237FB2FF' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M9 17C5 16 5 13 9 12' fill='none' stroke='%23FF8FB5' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='17' r='2' fill='%23E9EBEF'/%3E%3C/svg%3E" />
    <meta name="description" content="Follow the tokens: animated, explorable walk-throughs of the Transformer, inference engines and agents." />
  </head>
  <body>
    <button class="skip" type="button" data-t>Skip to the exhibit</button>
    <div class="app">
      <aside class="rail">
        <div>
          <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h18M3 12h18M3 17h18" stroke="var(--faint)" stroke-width="1.4" />
              <path d="M9 17C3 15 3 9 9 7" fill="none" stroke="var(--t0)" stroke-width="1.6" stroke-linecap="round" />
              <path d="M9 17C5 16 5 13 9 12" fill="none" stroke="var(--t2)" stroke-width="1.6" stroke-linecap="round" />
              <circle cx="9" cy="17" r="2" fill="var(--ink)" />
            </svg>
            <b>Token Trails</b>
          </div>
          <p class="tagline" data-t>Follow the tokens through AI systems</p>
          <button class="lang-btn" type="button"></button>
          <button class="rail-btn" type="button" aria-controls="nav" aria-expanded="true"></button>
        </div>
        <nav class="nav" id="nav" aria-label="Exhibits" data-t-aria></nav>
        <div class="rail-foot">
          <div data-t-html><kbd>Space</kbd> play / pause · <kbd>←</kbd> <kbd>→</kbd> step through phases</div>
          <div data-t>Click a part marked ↗ on the canvas to open its details.</div>
          <div class="foot-btns"><button class="theme-btn" type="button"></button><button class="theme-btn present-btn" type="button" aria-pressed="false" title="Hide the sidebar and enlarge captions; Escape to leave" data-t data-t-title>▭ Present</button></div>
        </div>
      </aside>
      <main class="main"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
