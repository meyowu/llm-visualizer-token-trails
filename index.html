<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Token Trails</title>
    <meta name="description" content="Follow the tokens: animated, explorable walk-throughs of the Transformer, inference engines and agents." />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div>
          <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h18M3 12h18M3 17h18" stroke="var(--faint)" stroke-width="1.4" />
              <path d="M9 17C3 15 3 9 9 7" fill="none" stroke="var(--t0)" stroke-width="1.6" stroke-linecap="round" />
              <path d="M9 17C5 16 5 13 9 12" fill="none" stroke="var(--t2)" stroke-width="1.6" stroke-linecap="round" />
              <circle cx="9" cy="17" r="2" fill="var(--ink)" />
            </svg>
            <b>Token Trails</b>
          </div>
          <p class="tagline">Follow the tokens through AI systems</p>
          <button class="rail-btn" type="button" aria-controls="nav" aria-expanded="true"></button>
        </div>
        <nav class="nav" id="nav" aria-label="Exhibits"></nav>
        <div class="rail-foot">
          <div class="legend"><span><i class="on"></i>Live</span><span><i></i>In progress</span></div>
          <div><kbd>Space</kbd> play / pause · <kbd>←</kbd> <kbd>→</kbd> step through phases</div>
          <div>Click a part marked ↗ on the canvas to open its details.</div>
        </div>
      </aside>
      <main class="main"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
