<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Token Trails</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230B0D11'/%3E%3Cg fill='none' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M2 7.5H10' stroke='%237FB2FF'/%3E%3Cpath d='M2 12H10' stroke='%23FF8FB5'/%3E%3Cpath d='M2 16.5H10' stroke='%2362D6BE'/%3E%3Cpath d='M14 7.5H22' stroke='%23BFA1DA'/%3E%3Cpath d='M14 12H22' stroke='%2391BCCC'/%3E%3Cpath d='M14 16.5H22' stroke='%23B1B3BA'/%3E%3C/g%3E%3Cpath d='M9.4 4L14.6 2V20L9.4 22Z' fill='%23E9EBEF' fill-opacity='.12' stroke='%23B7BDC8' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="description" content="Follow the tokens: animated, explorable walk-throughs of the Transformer, inference engines and agents." />
    <meta name="author" content="Zhehao Wu" />
  </head>
  <body>
    <button class="skip" type="button" data-t>Skip to the exhibit</button>
    <div class="app">
      <aside class="rail">
        <div>
          <a class="brand" href="#/home" title="Replay the opening animation" data-t-title>
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
              <!-- three token lanes pass through a layer (a glass plate) and leave with their hues mixed -->
              <path d="M2 7.5H10" fill="none" stroke-width="2" stroke-linecap="round" style="stroke: var(--t0)" />
              <path d="M2 12H10" fill="none" stroke-width="2" stroke-linecap="round" style="stroke: var(--t2)" />
              <path d="M2 16.5H10" fill="none" stroke-width="2" stroke-linecap="round" style="stroke: var(--t4)" />
              <path d="M14 7.5H22" fill="none" stroke-width="2" stroke-linecap="round" style="stroke: color-mix(in srgb, var(--t0), var(--t2))" />
              <path d="M14 12H22" fill="none" stroke-width="2" stroke-linecap="round" style="stroke: color-mix(in srgb, color-mix(in srgb, var(--t0), var(--t2)), var(--t4))" />
              <path d="M14 16.5H22" fill="none" stroke-width="2" stroke-linecap="round" style="stroke: color-mix(in srgb, var(--t2), var(--t4))" />
              <path d="M9.4 4L14.6 2V20L9.4 22Z" stroke-width="1.2" stroke-linejoin="round" style="fill: var(--ink); fill-opacity: .12; stroke: var(--ink2)" />
            </svg>
            <b>Token Trails</b>
          </a>
          <p class="tagline" data-t>Follow the tokens through AI systems</p>
          <div class="rail-meta">
            <button class="lang-btn" type="button"></button>
            <span class="byline" title="Made by Zhehao Wu" data-t-title>
              <span>Zhehao Wu</span>
              <a class="icon-link" href="https://github.com/meyowu/llm-visualizer-token-trails" target="_blank" rel="noopener" title="GitHub" aria-label="Zhehao Wu on GitHub" data-t-aria>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" /></svg>
              </a>
              <a class="icon-link" href="mailto:zhehao075@gmail.com" title="zhehao075@gmail.com" aria-label="Email Zhehao Wu" data-t-aria>
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3" /><path d="M2.2 4.2 8 8.6l5.8-4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></svg>
              </a>
            </span>
          </div>
          <button class="rail-btn" type="button" aria-controls="nav" aria-expanded="true"></button>
        </div>
        <nav class="nav" id="nav" aria-label="Exhibits" data-t-aria></nav>
        <div class="rail-foot">
          <div data-t-html><kbd>Space</kbd> play / pause · <kbd>←</kbd> <kbd>→</kbd> step through phases</div>
          <div data-t>Click a part marked ↗ on the canvas to open its details.</div>
          <div class="foot-btns"><button class="theme-btn" type="button"></button><button class="theme-btn present-btn" type="button" aria-pressed="false" title="Hide the sidebar and enlarge captions; Exit or Escape leaves" data-t data-t-title>▭ Present</button></div>
        </div>
      </aside>
      <main class="main"></main>
      <button class="present-exit" type="button" title="Leave presentation mode (Escape)" data-t data-t-title>✕ Exit presentation · Esc</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
